# .readthedocs.yaml
# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    pre_build:
      # If you have a docs/requirements.txt, keep this
            - pip install -r docs/requirements.txt || pip install -e .
    post_build:
      # Optional: build checks

sphinx:
  configuration: docs/conf.py
  # fail_on_warning: true  # uncomment when docs are clean

# Optionally build PDF / ePub
formats:
    - pdf
    - epub

python:
  install:
        - method: pip
      path: .
      extra_requirements:
                - docs
