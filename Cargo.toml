[package]
name = "cdgen"
version = "0.1.0"
edition = "2021"
description = "BlueBix Codegen - Minimal Git Platform in Rust"
license = "MIT"
authors = ["BlueBix <rogge>"]
repository = "https://codeberg.org/BlueBix/codegen"
keywords = ["git", "gitea", "codeberg", "self-hosted", "git-server"]
categories = ["development-tools"]

[[bin]]
name = "cdgencli"
path = "main.rs"

[dependencies]
# === WEB SERVER ===
axum = { version = "0.7", features = ["form", "multipart", "ws"] }
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
hyper = { version = "1.4", features = ["full"] }

# === CLI ===
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"

# === SERIALIZATION ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bincode = "1.3"

# === GIT CORE - Termux friendly (no vendored C libs) ===
git2 = { version = "0.19", default-features = false }
gix = { version = "0.64", default-features = false }

# === SSH SERVER - fixed ===
russh = "0.44"
russh-keys = "0.44"
russh-sftp = "2.0"
ssh-key = "0.6"

# === DATABASE - sqlite only for Termux ===
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# === AUTH & SECURITY - rustls only, no openssl ===
jsonwebtoken = "9.3"
argon2 = "0.5"
bcrypt = "0.15"
oauth2 = { version = "4.4", default-features = false, features = ["reqwest"] }

# === ASYNC & UTILS ===
futures = "0.3"
async-trait = "0.1"
futures-util = "0.3"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
dotenvy = "0.15"
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# === FILE SYSTEM & STORAGE ===
walkdir = "2.4"
tempfile = "3.10"
zip = "2.1"
tar = "0.4"
flate2 = "1.0"

# === HTTP CLIENT ===
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }

# === TEMPLATES ===
askama = { version = "0.12", features = ["with-axum"] }
pulldown-cmark = "0.10"

[profile.release]
lto = false
codegen-units = 1
strip = true
