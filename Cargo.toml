[package]
name = "cdgen"
version = "0.1.0"
edition = "2021"
description = "BlueBix Codegen - Minimal Git Platform in Rust"
authors = ["BlueBix <rogge>"]
license = "MIT License"
repository = "https://github.com/BlueBix/codegen"
keywords = ["git", "gitea", "codeberg", "self-hosted", "git-server"]
categories = ["development-tools"]

[[bin]]
name = "cdgencli"
path = "src/main.rs"

[dependencies]
# === WEB SERVER ===
axum = { version = "0.7", features = ["form", "multipart", "ws"] }
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
hyper = { version = "1.4", features = ["full"] }

# === CLI ===
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"

# === SERIALIZATION ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bincode = "1.3"

# === GIT CORE - this is what Gitea uses ===
git2 = { version = "0.19", features = ["vendored-libgit2"] }
gix = { version = "0.64", features = ["max-performance"] }
gix-attributes = "0.22"
gix-worktree = "0.34"

# === SSH SERVER - for git@ clone ===
russh = { version = "0.44", features = ["tokio"] }
russh-keys = "0.44"
russh-sftp = "2.0"
ssh-key = "0.6"

# === DATABASE - for users, repos, issues ===
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "postgres", "mysql", "chrono", "uuid"] }
sea-orm = { version = "0.12", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
diesel = { version = "2.2", features = ["sqlite", "postgres", "chrono", "r2d2"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# === AUTH & SECURITY ===
jsonwebtoken = "9.3"
argon2 = "0.5"
bcrypt = "0.15"
oauth2 = "4.4"
openidconnect = { version = "3.5", features = ["native-tls"] }
webauthn-rs = "0.5"

# === ASYNC & UTILS ===
futures = "0.3"
async-trait = "0.1"
futures-util = "0.3"
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
dotenvy = "0.15"
config = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# === FILE SYSTEM & STORAGE ===
notify = "6.1"
walkdir = "2.4"
tempfile = "3.10"
fs2 = "0.4"
zip = "2.1"
tar = "0.4"
flate2 = "1.0"

# === HTTP CLIENT & WEBHOOKS ===
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
octocrab = "0.38"

# === TEMPLATES & FRONTEND ===
tera = "1.19"
askama = { version = "0.12", features = ["with-axum"] }
minijinja = "2.2"
pulldown-cmark = { version = "0.10", features = ["simd"] }
syntect = "5.2"

[dev-dependencies]
tokio-test = "0.4"
axum-test = "15.0"
tempdir = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true