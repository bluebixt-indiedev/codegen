<!DOCTYPE HTML>
<html>
<head>
    <title>Dashboard - BlueBix Codegen</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
        }
        .user-info h2 {
            margin: 0;
            font-size: 24px;
        }
        .user-info p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .logout-btn:hover {
            background: white;
            color: #667eea;
        }
        .repos-section {
            margin-top: 40px;
        }
        .repos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .repos-header h3 {
            margin: 0;
            font-size: 20px;
        }
        .create-repo-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .create-repo-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .repos-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .repo-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .repo-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-3px);
        }
        .repo-name {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: #333;
        }
        .repo-description {
            font-size: 14px;
            color: #666;
            margin: 0 0 15px 0;
            min-height: 40px;
        }
        .repo-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #999;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
        }
        .repo-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .repo-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .clone-btn {
            background: #4CAF50;
            color: white;
        }
        .clone-btn:hover {
            background: #45a049;
        }
        .delete-btn {
            background: #f44336;
            color: white;
        }
        .delete-btn:hover {
            background: #da190b;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .modal-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            background: #764ba2;
        }
        .error-message {
            color: #f44336;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .success-message {
            background: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="page-wrapper">
        <!-- Header -->
        <div id="header-wrapper">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <header id="header">
                            <h1><a href="dashboard.html" id="logo">BlueBix Codegen</a></h1>
                            <nav id="nav">
                                <a href="dashboard.html" class="current-page-item">Dashboard</a>
                                <a href="#" id="logoutLink">Logout</a>
                            </nav>
                        </header>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard Content -->
        <div id="main">
            <div class="dashboard-container">
                
                <!-- User Header -->
                <div class="user-header">
                    <div class="user-info">
                        <h2>Welcome, <span id="username">User</span>!</h2>
                        <p id="email">your@email.com</p>
                    </div>
                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>

                <!-- Success Message -->
                <div class="success-message" id="successMessage"></div>

                <!-- Repositories Section -->
                <div class="repos-section">
                    <div class="repos-header">
                        <h3>Your Repositories</h3>
                        <button class="create-repo-btn" id="createRepoBtn">+ New Repository</button>
                    </div>

                    <div id="reposContainer" class="repos-list">
                        <!-- Repositories will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div id="footer-wrapper">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div id="copyright">
                            &copy; BlueBix Codegen. All rights reserved. | A Git Platform built with Rust 🦀
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Repository Modal -->
    <div id="createRepoModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <div class="modal-header">Create New Repository</div>
            <form id="createRepoForm">
                <div class="form-group">
                    <label for="repoName">Repository Name *</label>
                    <input 
                        type="text" 
                        id="repoName" 
                        name="name"
                        placeholder="my-awesome-repo"
                        minlength="1"
                        maxlength="50"
                        required
                    />
                    <div class="error-message" id="nameError"></div>
                </div>
                <div class="form-group">
                    <label for="repoDesc">Description</label>
                    <textarea 
                        id="repoDesc" 
                        name="description"
                        placeholder="A brief description of your repository..."
                        maxlength="200"
                    ></textarea>
                    <div class="error-message" id="descError"></div>
                </div>
                <button type="submit" class="submit-btn" id="submitRepoBtn">Create Repository</button>
            </form>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
