; forgejo/data/custom/conf/app.ini ← config (auto-generated on first boot, but you can pre-seed)
; This is your MAIN config - Forgejo reads this

[server]
DOMAIN = codegencc.web.app
ROOT_URL = https://codegencc.web.app/
HTTP_PORT = 3000
REDIRECT_OTHER_PORT = false
OFFLINE_MODE = false

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/data/forgejo.db
; For PostgreSQL use:
; DB_TYPE = postgres
; HOST = db:5432
; NAME = forgejo
; USER = forgejo
; PASSWD = changeme

[repository]
ROOT = ./git/repo
; Your custom builds-messages folder (for ashimokawa notifications)
; Forgejo will also store repos here

[service]
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = false

[webhook]
ALLOWED_HOST_LIST = *
; For builds-messages → ashimokawa phone: use webhook to ntfy.sh

[actions]
ENABLED = true

[lfs]
PATH = ./git/lfs
