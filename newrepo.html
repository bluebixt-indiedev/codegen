<!DOCTYPE HTML>
<html>
<head>
  <title>New Repository - BlueBix Codegen</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    body {
      background: #f5f7fb;
      color: #1f2937;
    }

    .dashboard-shell {
      max-width: 1180px;
      margin: 40px auto;
      padding: 0 20px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #111827, #2d3748);
      color: white;
      padding: 18px 24px;
      border-radius: 14px;
      margin-bottom: 28px;
      box-shadow: 0 10px 18px rgba(0,0,0,0.1);
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .topbar-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .btn.primary {
      background: #3b82f6;
      color: white;
    }

    .btn.primary:hover {
      background: #2563eb;
    }

    .btn.secondary {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .btn.secondary:hover {
      background: rgba(255,255,255,0.2);
    }

    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .repo-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 16px rgba(17, 22, 34, 0.04);
    }

    .repo-card h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .repo-card p {
      margin: 0 0 12px;
      color: #6b7280;
      line-height: 1.5;
    }

    .repo-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #9ca3af;
      font-size: 12px;
      padding-top: 10px;
      border-top: 1px solid #f3f4f6;
    }

    .repo-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .repo-actions button {
      flex: 1;
      padding: 9px 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .repo-actions .clone {
      background: #10b981;
      color: white;
    }

    .repo-actions .clone:hover {
      background: #059669;
    }

    .repo-actions .delete {
      background: #ef4444;
      color: white;
    }

    .repo-actions .delete:hover {
      background: #dc2626;
    }

    .empty {
      background: white;
      border: 1px dashed #d1d5db;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      color: #6b7280;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 22px;
      border-radius: 14px;
      width: min(420px, 92vw);
      box-shadow: 0 18px 42px rgba(0,0,0,0.18);
    }

    .modal-content h2 {
      margin: 0 0 18px;
      font-size: 22px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #374151;
    }

    .input,
    .textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .textarea {
      min-height: 90px;
    }

    .error {
      color: #ef4444;
      font-size: 12px;
      margin-top: 4px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="dashboard-shell">
    <div class="topbar">
      <div class="brand">Codegen</div>
      <div class="topbar-actions">
        <button class="btn secondary" id="logoutBtn">Logout</button>
        <button class="btn primary" id="newRepoBtn">New repository</button>
      </div>
    </div>

    <div id="statusBox" style="display:none; background:#dcfce7; color:#166534; padding:12px 16px; border-radius:10px; margin-bottom:16px;"></div>

    <div class="repo-grid" id="repoGrid"></div>
  </div>

  <div id="repoModal" class="modal" aria-modal="true">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Create repository</h2>
        <button id="closeModalBtn" class="btn secondary" style="border:none;">×</button>
      </div>

      <form id="repoForm">
        <label class="label" for="repoName">Repository name</label>
        <input class="input" id="repoName" name="name" type="text" placeholder="my-project" required />

        <label class="label" for="repoDescription">Description</label>
        <textarea class="textarea" id="repoDescription" name="description" placeholder="Brief description"></textarea>

        <div id="repoError" class="error"></div>

        <button class="btn primary" type="submit" style="width:100%; margin-top:10px;">Create repository</button>
      </form>
    </div>
  </div>

  <script src="newrepo.js"></script>
</body>
</html>
